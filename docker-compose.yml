services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vocal
      MYSQL_USER: vocal
      MYSQL_PASSWORD: vocal
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vocal?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: vocal
      DB_PASSWORD: vocal
      REDIS_HOST: redis
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
    depends_on: [mysql, redis]
    ports: ["8080:8080"]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports: ["8081:80"]
volumes: { mysql_data: {} }
